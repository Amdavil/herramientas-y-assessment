name = "pal-ai"
main = "worker.js"
compatibility_date = "2026-01-01"

# Proveedor del render fotorrealista de Deliflor Bloom Lab.
# La CLAVE va como secreto (`wrangler secret put IMAGE_API_KEY`); esto es sólo
# el nombre del proveedor, que no es sensible y conviene tener versionado.
#   gemini  → capa gratuita de Google AI Studio (hasta 500 imágenes/día)
#   openai  → platform.openai.com, de pago aparte de ChatGPT
#   fal     → el único junto a stability que respeta el prompt negativo
[vars]
IMAGE_PROVIDER = "openai"

# Almacén de las láminas ya generadas de Bloom Lab.
#
# La caché de borde de Cloudflare vive en cada centro de datos por separado:
# si el teléfono del visitante sale por uno distinto al del kiosco, falla el
# acierto y se vuelve a generar y a pagar la misma imagen. Este almacén es
# global, así que la reutilización deja de depender de por dónde entre cada
# aparato.
[[kv_namespaces]]
binding = "BLOOM_CACHE"
id = "be54c69fcc0547228f10f71e70ccad08"
