<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="canonical" href="https://amdavil.github.io/deliflor-bloom-lab/">
  <title>DELIFLOR Bloom Lab — redirigiendo…</title>
  <!--
    La flor completa viaja en el fragmento (#g=...) del enlace. Ni un
    meta-refresh ni un location.replace() hacia una URL sin fragmento lo
    conservan, así que un QR ya repartido acabaría en la pantalla de inicio
    sin la variedad del visitante. Por eso el salto se hace desde
    JavaScript arrastrando location.hash.

    El meta-refresh se deja fuera a propósito: se dispara antes que el
    script y se llevaría el fragmento por delante. Sin JavaScript la
    aplicación no arranca de todos modos, así que ahí basta el enlace de
    abajo, que también lo conserva.
  -->
  <script>
    (function () {
      var destino = 'https://amdavil.github.io/deliflor-bloom-lab/';
      location.replace(destino + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>DELIFLOR Bloom Lab ahora vive en su propio repositorio.
  Si no le redirige automáticamente, entre aquí:
  <a id="ir" href="https://amdavil.github.io/deliflor-bloom-lab/">https://amdavil.github.io/deliflor-bloom-lab/</a></p>
  <script>
    (function () {
      var a = document.getElementById('ir');
      if (a) a.href += location.search + location.hash;
    })();
  </script>
</body>
</html>
